<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>도슨트 메이트 — AI 글래스 미술관 시나리오</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101321;color:#f7f8ff;font-family:system-ui,sans-serif;text-align:center}p{color:#aab1c9}button{padding:12px 24px;cursor:pointer}</style></head>
<body><main><h1>도슨트 메이트</h1><p id="status" role="status">시나리오를 불러오는 중입니다…</p><button hidden id="retry" onclick="location.reload()">다시 시도</button></main>
<script>
(async()=>{
try{
const parts=new Array(35);let next=0,done=0;
await Promise.all(Array.from({length:6},async()=>{
while(next<35){const i=next++;const response=await fetch('docent-content-dbee6313/part-'+String(i).padStart(3,'0')+'.txt');if(!response.ok)throw new Error('HTTP '+response.status);parts[i]=await response.text();done++;document.getElementById('status').textContent='시나리오를 불러오는 중입니다… '+Math.round(done/35*100)+'%';}
}));
const html=parts.join('');document.open();document.write(html);document.close();
}catch(error){document.getElementById('status').textContent='시나리오를 불러오지 못했습니다. 다시 시도해 주세요.';document.getElementById('retry').hidden=false;console.error(error);}
})();
</script></body></html>
