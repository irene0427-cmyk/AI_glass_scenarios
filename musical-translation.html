/* Narrator captions only: -4 pt from the original responsive size. */
.subtitle-bar[data-role="narrator"] .subtitle-text {
  font-size: clamp(13.67px, calc(1.7vw - 5.33px), 22.67px);
}


.scene-navigation{grid-template-columns:repeat(8,minmax(0,1fr))}
.scene-background{transition:opacity .28s var(--ease),transform .55s var(--ease)}
.scene-background.is-changing{opacity:.22;transform:scale(1.008)}
.scene-canvas{display:none}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 70%,#06071412)}
.scene-nav-button{min-width:0}
.scene-nav-button .nav-label{overflow:hidden;text-overflow:ellipsis}
@media(max-width:1050px){.scene-navigation{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:680px){.app-shell{padding:0 12px 14px}.app-header{height:68px}.version{display:none}.player-main{grid-template-columns:1fr;gap:14px}.transport{justify-content:center}.playback-options{justify-self:stretch;text-align:center}.scene-navigation{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{width:100%}}
</style>
</head>
<body>
<div class="app-shell">
<header class="app-header">
<a class="brand" href="#" id="home-button" aria-label="청취 번역 처음으로">
<span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M4 14h10l2 3h4l2-3h10l-2 11h-8l-2-7h-4l-2 7H6z"/><path d="m4 14-1-4m29 4 1-4"/></svg></span>
<span><strong>청취 번역</strong><small>AI GLASSES · MUSICAL STORY</small></span>
</a>
<div class="header-actions">
<span class="version">INTERACTIVE STORY <b>04</b></span>
<button class="icon-button" id="sound-button" aria-label="소리 끄기" title="소리 끄기" aria-pressed="false"></button>
<button class="icon-button" id="fullscreen-button" aria-label="전체 화면" title="전체 화면"></button>
</div>
</header>
<main class="main">
<div class="stage-wrap">
<section class="stage" id="stage" aria-label="뮤지컬 청취 번역 시나리오 장면">
<img id="scene-background" class="scene-background" alt="">
<div id="scene-canvas" class="scene-canvas"><div id="overlay-layer"></div></div>
</section>
</div>
<section class="player">
<div class="player-main">
<div class="scene-caption">
<div class="scene-counter" id="scene-counter">SCENE 01 / 08</div>
<h1 id="scene-title"></h1>
<p id="scene-subtitle"></p>
</div>
<div class="transport">
<button class="icon-button" id="prev-button" aria-label="이전 장면" title="이전 장면"></button>
<button class="play-button" id="play-button"><span class="play-symbol" id="play-symbol"></span><span id="play-label">장면 재생</span></button>
<button class="icon-button" id="next-button" aria-label="다음 장면" title="다음 장면"></button>
</div>
<div class="playback-options">
<label class="auto-option"><input type="checkbox" id="auto-next" checked><span class="switch" aria-hidden="true"></span><span>자동 넘김</span></label>
<p class="playback-status" id="playback-status" role="status">장면부터 천천히 시작해요</p>
</div>
</div>
<nav class="scene-navigation" id="scene-navigation" aria-label="씬 선택"></nav>
<div class="player-footer">
<p><span class="legend-dot"></span><span id="phase-label">준비</span><span class="divider">/</span>장면 → 음성 → 다음 장면</p>
<p id="audio-note">음성: 한국어 TTS · 나레이션/사용자 구분 <span class="divider">·</span> 체코어 대사는 화면 자막 중심</p>
</div>
</section>
</main>
</div>
<audio id="voice-player" preload="metadata" playsinline></audio>
<script>
const scenes=[{"title":"공연 시작 전","short":"공연장 도착","subtitle":"해외 여행 · 뮤지컬 공연 대기","image":"https://d2ol7oe51mr4n9.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/62771bb0-10dd-46b6-bea1-4330247a405f.png","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/hf_20261101_230227_d0636a58-1185-4dfd-b3bf-cddabbd4b149.wav"},{"title":"청취 번역 모드 켜기","short":"모드 켜기","subtitle":"사용자 음성 명령 · 3인칭 시점","image":"https://d2ol7oe51mr4n9.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/9224aadd-235e-4d31-8b79-847f85966df1.png","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/hf_20261101_230227_f65f9726-a711-4ef4-86ef-c900bbf6d917.wav"},{"title":"번역 설정","short":"번역 설정","subtitle":"체코어 인식 · 한국어 번역 · 자막 스타일 공연","image":"https://d2ol7oe51mr4n9.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/7455608c-8412-4802-8efc-979616039855.png","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/hf_20261101_230227_cbc83200-25e2-471f-ba7a-e8af0b863fb6.wav"},{"title":"체코어 대사 인식","short":"대사 인식","subtitle":"실시간 음성 인식 · 1인칭 시점","image":"https://d2ol7oe51mr4n9.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/eaea747c-c3cb-4677-83e5-8dc704dccb5e.png","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/hf_20261101_230227_d8bdcbc6-678e-4475-9c6f-4932aaa3deb3.wav"},{"title":"한국어 자막 표시","short":"첫 번역","subtitle":"체코어 → 한국어 실시간 번역","image":"https://d2ol7oe51mr4n9.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/61e8a151-7b3c-4cf0-a6cb-99e28367c278.png","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/hf_20261101_230227_e3ade94a-e0e9-4067-b380-a71f0dc9cfd3.wav"},{"title":"상대 배우 대사 인식","short":"대화 이어짐","subtitle":"다음 화자의 대사를 계속 인식","image":"https://d2ol7oe51mr4n9.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/277ae1f4-3f29-411b-8336-2404625497ac.png","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/hf_20261101_230227_90faaba1-e967-4ab0-bad8-09bbf3551f89.wav"},{"title":"배우별 자막 구분","short":"화자 구분","subtitle":"배우별 다른 자막 색상","image":"https://d2ol7oe51mr4n9.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/8c67edb2-5820-4740-bd0a-9886d608bb1f.png","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/hf_20261101_230235_aecdd15e-f49b-4c01-bf8a-ce50b78ddefc.wav"},{"title":"청취 번역 모드 종료","short":"모드 끄기","subtitle":"공연 종료 · 사용자 음성 명령","image":"https://d2ol7oe51mr4n9.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/e21f4631-c1f4-4664-8346-5676317b777d.png","audio":"https://d8j0ntlcm91z4.cloudfront.net/user_3JHCElkGFsmPZFrL67etaeUahXW/hf_20261101_230235_f24cf2d5-687b-4ac8-8224-6d01370146e1.wav"}];
const $=id=>document.getElementById(id);
const bg=$('scene-background'),audio=$('voice-player');
const icons={
volume:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m11 4-6 5H2v6h3l6 5V4Z"/><path d="M15 8a6 6 0 0 1 0 8M18 4a11 11 0 0 1 0 16"/></svg>',
mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m11 4-6 5H2v6h3l6 5V4Z"/><path d="m16 9 6 6m0-6-6 6"/></svg>',
fullscreen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>',
prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4v16M19 4 8 12l11 8V4Z"/></svg>',
next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 4v16M5 4l11 8-11 8V4Z"/></svg>',
play:'<svg viewBox="0 0 24 24"><path d="m7 4 14 8-14 8V4Z"/></svg>',
pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>'
};
let index=0,playing=false,muted=false,transitionTimer=null;
$('sound-button').innerHTML=icons.volume;$('fullscreen-button').innerHTML=icons.fullscreen;$('prev-button').innerHTML=icons.prev;$('next-button').innerHTML=icons.next;
function setPlayIcon(){ $('play-symbol').innerHTML=playing?icons.pause:icons.play; $('play-label').textContent=playing?'일시정지':'장면 재생';}
function status(t,phase='준비'){ $('playback-status').textContent=t; $('phase-label').textContent=phase;}
function renderNav(){
 const nav=$('scene-navigation');nav.innerHTML='';
 scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='scene-nav-button';b.innerHTML='<span class="nav-number">'+String(i+1).padStart(2,'0')+'</span><span class="nav-label">'+s.short+'</span>';if(i===index)b.setAttribute('aria-current','step');b.onclick=()=>loadScene(i,true);nav.appendChild(b);});
}
function loadScene(i,autoplay=false){
 clearTimeout(transitionTimer);audio.pause();audio.currentTime=0;playing=false;setPlayIcon();
 index=(i+scenes.length)%scenes.length;const s=scenes[index];
 bg.classList.add('is-changing');
 const img=new Image();img.onload=()=>{bg.src=s.image;bg.alt=s.title;requestAnimationFrame(()=>bg.classList.remove('is-changing'));};img.src=s.image;
 $('scene-counter').textContent='SCENE '+String(index+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');
 $('scene-title').textContent=s.title;$('scene-subtitle').textContent=s.subtitle;
 $('prev-button').disabled=index===0;$('next-button').disabled=index===scenes.length-1;
 audio.src=s.audio;audio.muted=muted;audio.load();renderNav();status('재생할 준비가 되었어요','준비');
 if(autoplay) setTimeout(playScene,420);
}
function playScene(){
 if(playing){audio.pause();playing=false;setPlayIcon();status('잠시 멈췄어요','일시정지');return;}
 if(audio.ended||audio.currentTime>=audio.duration-.05) audio.currentTime=0;
 const p=audio.play();playing=true;setPlayIcon();status('음성을 재생하고 있어요','음성 재생');
 if(p&&p.catch)p.catch(()=>{playing=false;setPlayIcon();status('재생 버튼을 눌러 음성을 시작해 주세요','재생 대기');});
}
audio.onpause=()=>{if(!audio.ended){playing=false;setPlayIcon();}};
audio.onended=()=>{playing=false;setPlayIcon();status('장면을 확인했어요','완료');if($('auto-next').checked&&index<scenes.length-1){transitionTimer=setTimeout(()=>loadScene(index+1,true),700);}};
$('play-button').onclick=playScene;
$('prev-button').onclick=()=>loadScene(index-1,false);
$('next-button').onclick=()=>loadScene(index+1,false);
$('sound-button').onclick=()=>{muted=!muted;audio.muted=muted;$('sound-button').innerHTML=muted?icons.mute:icons.volume;$('sound-button').setAttribute('aria-pressed',String(muted));$('sound-button').title=muted?'소리 켜기':'소리 끄기';};
$('fullscreen-button').onclick=()=>{const el=document.documentElement;if(!document.fullscreenElement){el.requestFullscreen?.();}else{document.exitFullscreen?.();}};
$('home-button').onclick=e=>{e.preventDefault();loadScene(0,false);};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&index<scenes.length-1)loadScene(index+1,false);if(e.key==='ArrowLeft'&&index>0)loadScene(index-1,false);if(e.code==='Space'){e.preventDefault();playScene();}});
loadScene(0,false);
</script>
</body></html>
